<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | EntregaSegura</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #eff6ff; }
        .card { width: min(460px, 100%); padding: 36px; background: white; border-radius: 20px; box-shadow: 0 15px 40px #0f172a22; }
        h1 { color: #1e3a8a; }
        label { display: block; margin: 16px 0 7px; font-weight: 700; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; }
        .errors { margin-top: 6px; color: #b91c1c; font-size: 13px; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 9px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Cambia tu contraseña</h1>
        <p>Por seguridad, debes reemplazar la contraseña temporal antes de continuar.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
            {% endfor %}
            <button type="submit">Guardar nueva contraseña</button>
        </form>
    </main>
</body>
</html>
