<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva actividad</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; }
        .card { max-width: 700px; margin: 0 auto; background: white; padding: 28px; border-radius: 14px; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        h1 { margin-bottom: 20px; }
        form { display: grid; gap: 16px; }
        .field { display: grid; gap: 6px; }
        input, select, textarea, button { font: inherit; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; }
        a { display: inline-block; margin-top: 16px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Crear actividad</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <small>{{ field.errors }}</small>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit">Guardar actividad</button>
        </form>
        <a href="{% url 'entregas_docente:lista_entregas_docente' %}">Volver</a>
    </div>
</body>
</html>
